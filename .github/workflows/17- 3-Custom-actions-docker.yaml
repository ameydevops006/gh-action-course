name: 17 - 3 - Custom Actions - Docker
run-name: 17 - 3 - Custom Actions - Docker
on: 
  workflow_dispatch:
    inputs:
      url:
        type: string
        default: 'https://www.google.com'
      
      max_trials:
        default: '10'
        required: false

      delay:
        required: false
        default: '5'

      
jobs:
  Ping-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping URL
        id: ping-url
        uses: ./.github/actions/docker-ping-url
        with:
          url: ${{ inputs.url }}
          max-trials: ${{ inputs.max_trials }}
          delay: ${{ inputs.delay }}
      
      - name: Print ping result
        run: |
          echo "Website reachable: ${{ steps.ping-url.outputs.website-reachable }}"
