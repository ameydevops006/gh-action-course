name: Cache Node and NPM Dependencies
description: This action allows to cache both Node and NPM dependencies based on package-lock.json file.

inputs:
  node-version:
    description: NodeJS version to Use
    required: true
    default: '24.x'
  
  working-dir:
    default: .
    required: true
  
  target-env:
    description: '"dev" or "prod". Control whether dev dependencies are installed or not'
    default: dev
    required: false


outputs:
  installed-deps:
    description: whether dependencies were installed or not
    value: ${{ steps.cache.outputs.cache-hit != 'true' }}
runs:
  using: composite
  steps:
    
    - name: Setup Node Version ${{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache dependencies
      id: cache
      uses: actions/cache@v3
      with:
        path: ${{ inputs.working-dir }}/node_modules
        key: node-modules-${{ hashFiles('${{ inputs.working-dir }}/package-lock.json') }}
    
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: ${{ inputs.target-env == 'dev' && 'npm ci'|| 'npm ci --omit=dev' }}
      shell: bash
      working-directory: ${{ inputs.working-dir }}